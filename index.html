<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VindrellOS</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="bootScreen" class="boot-screen">
      <div class="boot-logo-wrap">
        <div class="boot-logo">V</div>
        <div class="boot-name">VindrellOS</div>
      </div>

      <div class="boot-bar-wrap">
        <div class="boot-bar">
          <div id="bootProgress" class="boot-progress"></div>
        </div>
        <div id="bootPercent" class="boot-percent">0%</div>
      </div>
    </div>

    <div id="desktop" class="desktop hidden">
      <div class="topbar">
        <div class="left-bar">
          <div class="topbar-pill">Finder</div>
          <div class="topbar-pill">File</div>
          <div class="topbar-pill">Edit</div>
        </div>

        <div class="center-bar">
          <span class="status-dot"></span>
          <span>VindrellOS</span>
        </div>

        <div class="right-bar">
          <span id="systemTime">9:41 AM</span>
        </div>
      </div>

      <div class="desktop-icons">
        <div class="icon app-icon" data-app="settings">
          <div class="icon-graphic settings-icon">⚙</div>
          <span>Settings</span>
        </div>

        <div class="icon app-icon" data-app="movies">
          <div class="icon-graphic movies-icon">▶</div>
          <span>Movies/TV</span>
        </div>

        <div class="icon app-icon" data-app="browser">
          <div class="icon-graphic browser-icon">◌</div>
          <span>Browser</span>
        </div>

        <div class="icon app-icon" data-app="games">
          <div class="icon-graphic games-icon">✦</div>
          <span>Games</span>
        </div>

        <div class="icon app-icon" data-app="files">
          <div class="icon-graphic files-icon">▣</div>
          <span>Files</span>
        </div>
      </div>

      <div id="windowsLayer" class="windows-layer"></div>

      <div class="dock">
        <div class="dock-inner">
          <button class="dock-item active" data-app="finder" title="Finder">◫</button>
          <button class="dock-item app-button" data-app="browser" title="Browser">◌</button>
          <button class="dock-item app-button" data-app="movies" title="Movies/TV">▶</button>
          <button class="dock-item app-button" data-app="settings" title="Settings">⚙</button>
          <button class="dock-item app-button" data-app="games" title="Games">✦</button>
          <button class="dock-item app-button" data-app="files" title="Files">▣</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
